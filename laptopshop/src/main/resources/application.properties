spring.application.name=laptopshop
server.port = ${PORT:9765}
server.host = http://127.0.0.1:9765
server.error.whitelabel.enabled=false
spring.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.jackson.visibility.field=any
server.address=0.0.0.0

### File upload config ###
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

### Mysql ###
#spring.datasource.url=jdbc:mysql://127.0.0.1:3306/laptop_store?allowPublicKeyRetrieval=true&useSSL=false
#spring.datasource.username=root
#spring.datasource.password=Vuhung2004@

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG

### Hibernate ###
hibernate.dialect = org.hibernate.dialect.MySQLDialect
hibernate.show_sql = false
hibernate.format_sql = false
spring.jpa.hibernate.ddl-auto=none


